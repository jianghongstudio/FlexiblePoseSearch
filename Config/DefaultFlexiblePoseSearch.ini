+PackageRedirects=(OldName="/Script/NxPoseSearchEditor",NewName="/Script/FlexiblePoseSearchEditor")
+PackageRedirects=(OldName="/Script/NxPoseSearchGraph",NewName="/Script/FlexiblePoseSearchGraph")
+ClassRedirects=(OldName="/Script/NxPoseSearch.NxPoseSearchData",NewName="/Script/FlexiblePoseSearch.FlexiblePoseSearchData")
+ClassRedirects=(OldName="/Script/NxPoseSearch.AnimNotifyState_NxPoseSearch",NewName="/Script/FlexiblePoseSearch.AnimNotifyState_FlexiblePoseSearch")
+ClassRedirects=(OldName="/Script/NxPoseSearch.NxPoseSearchLibrary",NewName="/Script/FlexiblePoseSearch.FlexiblePoseSearchLibrary")
+EnumRedirects=(OldName="/Script/NxPoseSearch.ENxPoseSearchSourceMode",NewName="/Script/FlexiblePoseSearch.EFlexiblePoseSearchSourceMode",ValueChanges=(("NxSmallLibrary","SmallLibrary"),("NativePSD","NativePSD")))
+EnumRedirects=(OldName="/Script/NxPoseSearch.ENxPoseSearchNativeSearchScope",NewName="/Script/FlexiblePoseSearch.EFlexiblePoseSearchNativeSearchScope")
